<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>Freedom CQA · Администратор</title>
  <link rel="icon" href="/shared/brand/freedom-broker-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/shared/theme-light.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="l">
  <!-- Login -->
  <main id="login" class="login" hidden>
    <form class="login__card" id="login-form" novalidate>
      <img class="login__logo" src="/shared/brand/freedom-broker-logo.svg" alt="Freedom Broker" width="178" height="40">
      <h1 class="login__title">Контроль качества диалогов</h1>
      <p class="login__lead">Оценки чатов и звонков, апелляции, чек-лист и живые чаты в одном окне.</p>
      <label class="field">
        <span class="field__label">Код доступа</span>
        <input id="login-pass" class="input" type="password" name="passcode" autocomplete="current-password" required aria-describedby="login-err login-hint">
      </label>
      <p class="login__err" id="login-err" role="alert" aria-live="assertive"></p>
      <button class="btn btn--primary btn--l login__btn" type="submit" id="login-btn">Войти</button>
      <p class="login__hint" id="login-hint">Демо-код для жюри: freedom</p>
    </form>
  </main>

  <!-- App -->
  <div id="app" class="shell" hidden>
    <aside class="rail" id="rail" aria-label="Разделы">
      <div class="rail__top">
        <a class="rail__brand" href="#/overview" aria-label="Freedom CQA, обзор">
          <img class="rail__logo" src="/shared/brand/freedom-broker-logo.svg" alt="" width="124" height="28">
          <svg class="rail__mark" viewBox="0 0 97 112" aria-hidden="true"><path d="M96.9942 0V26.9824C96.9942 97.2299 48.5809 111.542 48.5809 111.542L48.4978 111.565L48.4153 111.542C48.4153 111.542 43.9448 110.221 37.7221 106.411C23.4632 97.6801 0 75.8861 0 26.9824V0H96.9942Z" fill="#164734"/><path d="M96.9945 10.687C96.9945 19.6639 89.7167 26.9414 80.7398 26.9416H37.7106V48.467H75.4271V59.154C75.4271 67.7761 68.7078 74.8346 60.2174 75.3744H37.7087V106.402C23.4485 97.6657 8.6014e-05 75.8705 0 26.9826V0H96.9945V10.687Z" fill="#02B140"/></svg>
        </a>
        <span class="rail__product">Контроль качества</span>
        <button class="icon-btn rail__toggle" type="button" id="rail-toggle" aria-expanded="false" aria-controls="rail" aria-label="Развернуть меню"><svg viewBox="0 0 24 24" aria-hidden="true" class="ic"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
      </div>
      <nav class="rail__nav" id="nav" aria-label="Основное меню"></nav>
      <div class="rail__foot">
        <div class="rail__ai" id="ai-status"></div>
        <button class="nav-item nav-item--quiet" type="button" data-logout>
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
          <span class="nav-item__label">Выйти</span>
        </button>
      </div>
    </aside>
    <div class="main">
      <header class="top">
        <div class="top__titles">
          <h1 class="top__title" id="page-title">Обзор</h1>
          <p class="top__sub" id="page-sub"></p>
        </div>
        <div class="top__tools" id="top-tools"></div>
        <button class="icon-btn top__logout" type="button" data-logout aria-label="Выйти">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l-4-4 4-4M6 12h10"/></svg>
        </button>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <div class="busy" id="busy" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="admin.js"></script>
</body>
</html>
